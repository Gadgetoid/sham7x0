name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install SDL3
        run: brew install sdl3
      - name: Build
        run: make -k -j3 && make headless
      - name: Smoke test
        run: SDL_VIDEO_DRIVER=dummy ./sham7x0 --data=build/smoke --screenshot=build/smoke/screen.bmp --frames=5 && test -s build/smoke/screen.bmp
      - name: Test
        run: python3 tools/test.py
      - name: Package
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: sham7x0-macos
          path: dist/*.zip
      - name: Build with Touchscreen Mode
        run: make -j3 TOUCHSCREEN=1

  linux:
    runs-on: ubuntu-latest
    container: debian:bookworm
    env:
      SDL_STATIC: 1
      PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config python3 git ca-certificates zip curl cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: SDL3
        run: sh tools/sdl3-static.sh /opt/sdl3
      - name: Build
        run: make -k -j4 && make headless
      - name: Smoke test
        run: SDL_VIDEO_DRIVER=dummy ./sham7x0 --data=build/smoke --screenshot=build/smoke/screen.bmp --frames=5 && test -s build/smoke/screen.bmp
      - name: Test
        run: python3 tools/test.py
      - name: Package
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: sham7x0-linux
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            git
            python
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: make -k -j4 && make headless
      - name: Rebuild is a no-op
        run: make -q
      - name: Smoke test
        run: SDL_VIDEO_DRIVER=dummy ./sham7x0 --data=build/smoke --screenshot=build/smoke/screen.bmp --frames=5 && test -s build/smoke/screen.bmp
      - name: Test
        run: python3 tools/test.py
      - name: Package
        run: make dist
      - name: Packaged smoke test
        run: cd dist/sham7x0-windows-*/ && PATH=/usr/bin SDL_VIDEO_DRIVER=dummy ./sham7x0.exe --data=smoke --screenshot=smoke/screen.bmp --frames=5 && test -s smoke/screen.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: sham7x0-windows
          path: dist/*.zip
